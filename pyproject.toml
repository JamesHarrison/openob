[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenOB"
version = "5.0.0"
description = "Broadcast audio over IP codec built with PyGObject + GStreamer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "James Harrison", email = "james@talkunafraid.co.uk" },
]
keywords = ["audio", "broadcast", "rtp", "gstreamer", "opus"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "redis>=4,<6",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-timeout>=2",
]

[project.scripts]
openob = "openob.cli:main"

[project.urls]
Homepage = "https://github.com/JamesHarrison/openob"
Repository = "https://github.com/JamesHarrison/openob"
Changelog = "https://github.com/JamesHarrison/openob/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["openob*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

