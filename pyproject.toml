[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenOB"
version = "6.3.0"
description = "Broadcast audio over IP codec built with PyGObject + GStreamer"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    { name = "James Harrison", email = "james@talkunafraid.co.uk" },
]
keywords = ["audio", "broadcast", "rtp", "srtp", "gstreamer", "opus"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # SRTP master-key derivation via HKDF-SHA256. Has wheels for ARM (the Pi
    # target). Pin to 42+ for the post-Rust hashlib backend that ships fast
    # ARM builds.
    "cryptography>=42",
    # TOML parser for 3.9/3.10. Stdlib `tomllib` is used directly on 3.11+.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-timeout>=2",
]
# Only needed by the one-shot `openob migrate-v5` helper. Lazy-imported in
# openob.migrate so the runtime never touches it.
migrate = [
    "redis>=3",
]
# Optional OTLP metrics + structured logging. Lazy-imported in
# openob.telemetry so the base install (and the audio path) never touches
# OTel. HTTP/protobuf exporter only — gRPC has armv6 wheel pain on Pi Zero
# and brings the protobuf-version-conflict mess that's tracked in OTel
# issue #4563. Pi 3+ is supported; Pi Zero is best-effort and may need a
# piwheels source build for `protobuf`.
telemetry = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[project.scripts]
openob = "openob.cli:main"

[project.urls]
Homepage = "https://github.com/JamesHarrison/openob"
Repository = "https://github.com/JamesHarrison/openob"
Changelog = "https://github.com/JamesHarrison/openob/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["openob*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
